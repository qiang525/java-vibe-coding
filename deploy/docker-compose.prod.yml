# =============================================================================
#  CourseHub 生产环境编排
# -----------------------------------------------------------------------------
#  启动：docker compose -f deploy/docker-compose.prod.yml up -d
#  停止：docker compose -f deploy/docker-compose.prod.yml down
#  看日志：docker compose -f deploy/docker-compose.prod.yml logs -f backend
#
#  ⚠️ 所有密码都从 .env 文件读取，绝不写死在这个文件里
# =============================================================================

services:

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: coursehub-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: coursehub
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=256M
    volumes:
      - coursehub_mysql_data:/var/lib/mysql
      # 首次启动自动执行建表与种子数据（只在数据卷为空时执行一次）
      - ../backend/sql:/docker-entrypoint-initdb.d:ro
      - ./backup:/backup
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - coursehub

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: coursehub-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - coursehub_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coursehub

  # ---------- 后端 ----------
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: coursehub-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      # 生产配置：全部通过环境变量注入，镜像里不含任何密钥
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coursehub?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      COURSEHUB_FILE_LOCAL_PATH: /app/upload
      COURSEHUB_FILE_TEMP_PATH: /app/upload/temp
    volumes:
      # ⚠️ 上传的文件必须挂载出来，否则容器重建后文件全丢
      - coursehub_upload:/app/upload
    networks:
      - coursehub

  # ---------- 前端（含 Nginx）----------
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    container_name: coursehub-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      # - "443:443"   # 配好 HTTPS 后打开
    volumes:
      # 如果要启用 HTTPS，把证书目录挂进来
      - ./certs:/etc/nginx/certs:ro
    networks:
      - coursehub

volumes:
  coursehub_mysql_data:
  coursehub_redis_data:
  coursehub_upload:

networks:
  coursehub:
    driver: bridge
