# =============================================================================
#  CourseHub Nginx 配置（生产环境）
# -----------------------------------------------------------------------------
#  作用：作为整个系统的统一入口，负责四件事：
#    1. 把 /api 开头的请求转发给后端（反向代理）
#    2. 把其余请求交给前端静态文件
#    3. 开启 gzip 压缩，减小传输体积
#    4. 限制上传大小、设置超时（大文件上传必需）
# =============================================================================

# 上游后端服务
upstream coursehub_backend {
    server backend:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;                       # 换成你的域名

    # ⚠️ 关键：不设这个，上传大文件会被 Nginx 直接拒绝（413）
    client_max_body_size 600M;

    # 字符集
    charset utf-8;

    # ---------- gzip 压缩 ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    # ---------- 前端静态文件 ----------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 单页应用（SPA）：找不到文件就回落到 index.html，
        # 否则用户刷新 /resources/1 这种路由会 404
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，内容变则文件名变，可以放心缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass http://coursehub_backend;
        proxy_http_version 1.1;

        # 传递真实客户端信息（后端取 IP 时要用）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 大文件上传慢，超时要放宽
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 上传大文件时不要缓冲请求体
        proxy_request_buffering off;
    }

    # ---------- 接口文档（生产环境建议关掉或加访问限制）----------
    location /doc.html {
        proxy_pass http://coursehub_backend;
        proxy_set_header Host $host;
        # 如果只在开发时用，把这行取消注释：
        # deny all;
    }

    location /webjars/ {
        proxy_pass http://coursehub_backend;
    }
    location /swagger-resources/ {
        proxy_pass http://coursehub_backend;
    }
    location /v2/api-docs {
        proxy_pass http://coursehub_backend;
    }

    # ---------- 健康检查 ----------
    location /health {
        proxy_pass http://coursehub_backend/api/health;
        access_log off;
    }

    # 隐藏 Nginx 版本号（安全加固）
    server_tokens off;
}

