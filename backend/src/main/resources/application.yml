# =============================================================================
#  CourseHub 主配置文件
# -----------------------------------------------------------------------------
#  作用：所有环境通用的配置
#  环境差异（数据库密码、日志级别等）放在 application-{profile}.yml 里
#
#  启动时通过 --spring.profiles.active=dev 指定环境
# =============================================================================
spring:
  application:
    name: coursehub
  # 默认激活开发环境
  profiles:
    active: dev
  # 文件上传限制（分片上传时单片 5MB，但合流请求会带全量，故放宽）
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 600MB
      enabled: true
  # 序列化配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  # ⚠️ 关键配置：Spring Boot 2.6+ 默认使用 PathPatternParser，
  #    而 Knife4j/Swagger 依赖 AntPathMatcher，不改这个启动会失败
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    # 保留默认静态资源映射：否则 /doc.html 等静态资源会 404
    # 404 的统一格式改由 CustomErrorController 处理

# =============================================================================
#  服务器配置
# =============================================================================
server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  # Tomcat 优化
  tomcat:
    threads:
      max: 200
      min-spare: 20
    connection-timeout: 20000
    max-connections: 8192
    accept-count: 100
    uri-encoding: UTF-8

# =============================================================================
#  MyBatis 配置
# =============================================================================
mybatis:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类包路径，XML 里可直接写类名而不用全限定名
  # 多个包用英文逗号分隔：entity（表实体）+ vo（视图对象，如 CourseVO）
  # 不注册 vo 包的话，XML 里的 resultType="CourseVO" 会报 ClassNotFoundException
  type-aliases-package: com.nnuist.coursehub.entity,com.nnuist.coursehub.vo
  configuration:
    # 数据库下划线字段 → Java 驼峰属性 自动映射
    # 例如 create_time → createTime
    map-underscore-to-camel-case: true
    # 开启二级缓存（默认关闭，需要时在 XML 里单独开启）
    cache-enabled: false
    # 返回 null 的字段也显示出来（便于前端处理）
    call-setters-on-nulls: true

# =============================================================================
#  日志配置
# =============================================================================
logging:
  level:
    root: info
    com.nnuist.coursehub: debug
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"

# =============================================================================
#  Knife4j 接口文档
# =============================================================================
knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 数据模型

# =============================================================================
#  业务自定义配置
# =============================================================================
coursehub:
  # JWT 配置
  jwt:
    # 密钥：生产环境必须通过环境变量注入，禁止硬编码
    secret: ${JWT_SECRET:CourseHubDefaultSecretKey2026ForDevelopmentOnlyPleaseChange}
    # 有效期 7 天（毫秒）
    expire: 604800000
    header: Authorization
    prefix: "Bearer "
  # 文件存储配置
  file:
    # 存储方式：local / minio
    storage-type: local
    # 本地存储路径（相对项目根目录）
    local-path: ./upload
    # 临时分片目录
    temp-path: ./upload/temp
    # 单文件最大 500MB
    max-size: 524288000
    # 分片大小 5MB
    chunk-size: 5242880
  # 可信度评分权重（总和为 1.0）
  score:
    weight:
      completeness: 0.25   # 文件完整度
      uploader: 0.20       # 上传者信用
      rating: 0.20         # 社区评价
      recognition: 0.25    # 社区认可度（下载/收藏）
      freshness: 0.10      # 时效性
    # 每学期时效衰减比例
    freshness-decay-per-term: 0.15
