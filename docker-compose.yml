version: '3.8'

# 一键启动本地依赖：docker-compose up -d
# 数据卷映射到 D 盘，避免占用 C 盘空间
services:
  mysql:
    image: mysql:8.0
    container_name: coursehub-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: coursehub
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      # ⚠️ 按个人实际路径调整，务必不要放在 C 盘
      - D:/dev-data/coursehub/mysql:/var/lib/mysql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coursehub-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - redis123456
    volumes:
      - D:/dev-data/coursehub/redis:/data

  minio:
    image: minio/minio:latest
    container_name: coursehub-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - D:/dev-data/coursehub/minio:/data
