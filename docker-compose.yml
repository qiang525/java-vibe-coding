# =============================================================================
#  CourseHub 本地依赖编排（只负责起 MySQL / Redis / MinIO 三个中间件）
# -----------------------------------------------------------------------------
#  用途：不想在本机安装 MySQL/Redis 时，用 Docker 一键起依赖。
#  启动：docker compose up -d
#  停止：docker compose down
#  看日志：docker compose logs -f mysql
#
#  ⚠️ 所有密码都从同目录的 .env 读取，**绝不写死在本文件里**
#     第一次使用：把 .env.example 复制成 .env，改成自己的密码
#     （.env 已在 .gitignore 中，不会被提交到 Git）
#
#  ⚠️ 数据卷放在 F 盘：本项目约定大文件不放在 C 盘和 D 盘。
#     路径可按需修改，但请不要指向 C 盘。
#
#  📌 minio 是早期规划的对象存储「预留」服务。
#     当前项目实际用的是本地文件存储（storage/LocalFileStorage），
#     MinIO 实现尚未启用 —— 不需要可以把这一段整体删掉。
# =============================================================================

services:

  # ---------- MySQL ----------
  mysql:
    image: mysql:8.0
    container_name: coursehub-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: coursehub
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - F:/dev-data/coursehub/mysql:/var/lib/mysql
      # 首次启动（数据卷为空时）自动执行建表与种子数据
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - coursehub

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    container_name: coursehub-redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      TZ: Asia/Shanghai
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - F:/dev-data/coursehub/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coursehub

  # ---------- MinIO（预留，当前未启用）----------
  minio:
    image: minio/minio:latest
    container_name: coursehub-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command: server /data --console-address ":9001"
    volumes:
      - F:/dev-data/coursehub/minio:/data
    networks:
      - coursehub

networks:
  coursehub:
    driver: bridge
